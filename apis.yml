aid: datalot
name: Datalot
description: 'Datalot (now operating under parent company Centerfield Insurance Services) is an analytics-driven
  digital customer-acquisition and live lead/call marketplace platform for the insurance industry, spanning
  auto, home, life, health, Medicare, and commercial lines. It runs digital demand-generation campaigns,
  qualifies consumers in a real-time marketplace, and routes them by data to carriers and agents, adding
  agent-presence and telephony management, TCPA/regulatory compliance tooling, and secondary-market handling
  for unmatched consumers. Named carrier clients include Liberty Mutual, Allstate, Farmers, Progressive,
  Travelers, Aetna, and Humana. The company is SOC 2 certified. It was surfaced as a portfolio company of
  bessemer-venture-partners; the customer-facing surface is an authenticated carrier/agent portal at
  app.datalot.com with no public API, SDK, or developer documentation.'
